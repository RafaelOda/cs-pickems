[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cs-swiss-simulator"
version = "0.1.0"
description = "Deterministic simulator for the 16-team Counter-Strike Major Swiss format"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
swiss = "swiss.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/swiss"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

